name: Phase 35 Global Save Failure Patcher

on:
  push:
    branches: ["bugfix/phase35-global-save-failure"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Apply patch
        run: python scripts/phase35_patch.py
      - name: Validate implementation
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npx cap sync ios
          git diff --exit-code -- ios
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git status --short
          git commit -m "Phase 35: keep save failure recovery visible across views"
          git push origin HEAD:bugfix/phase35-global-save-failure
