name: Phase 38 Native Durable Snapshot Patcher

on:
  push:
    branches: ["bugfix/phase38-native-durable-snapshot"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Capacitor Filesystem plugin
        run: npm install @capacitor/filesystem@7.1.8 --save-exact
      - name: Apply source and native patch
        run: |
          python scripts/phase38_patch.py
          python scripts/phase38_fix_render_refs.py
          python scripts/phase38_fix_native_web_skip.py
      - name: Validate implementation
        run: |
          npm audit --omit=dev --audit-level=high
          npm run check
          npx cap sync ios
          grep -q "CapacitorFilesystem" ios/App/Podfile
          grep -q "NSPrivacyAccessedAPICategoryFileTimestamp" ios/App/App/PrivacyInfo.xcprivacy
          grep -q "C617.1" ios/App/App/PrivacyInfo.xcprivacy
          grep -q "PrivacyInfo.xcprivacy in Resources" ios/App/App.xcodeproj/project.pbxproj
          git diff --check
      - name: Commit Phase 38 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src ios
          git status --short
          git commit -m "Phase 38: add native durable note snapshots"
          git push origin HEAD:bugfix/phase38-native-durable-snapshot
