name: Phase 40 Visible Candidate Count

on:
  push:
    branches: ["bugfix/phase40-dirty-three-way-recovery"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Apply visible candidate count fix
        run: python scripts/phase40_visible_candidate_count.py
      - name: Validate visible candidate count fix
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npx cap sync ios
          git diff --exit-code -- ios
          git diff --check
      - name: Commit source and regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/__tests__/App.native-durable-snapshot.test.tsx
          git commit -m "Phase 40: keep recovery count aligned with visible candidate"
          git push origin HEAD:bugfix/phase40-dirty-three-way-recovery
