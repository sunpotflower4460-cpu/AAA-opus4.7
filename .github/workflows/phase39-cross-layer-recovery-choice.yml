name: Phase 39 Cross-Layer Recovery Choice

on:
  push:
    branches: ["bugfix/phase39-cross-layer-recovery-choice"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Apply cross-layer recovery patch
        run: python scripts/phase39_cross_layer_recovery_choice.py
      - name: Validate cross-layer recovery patch
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npx cap sync ios
          git diff --exit-code -- ios
          git diff --check
      - name: Commit source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/lib/i18n.ts src/__tests__/App.native-durable-snapshot.test.tsx
          git commit -m "Phase 39: surface cross-layer recovery alternatives"
          git push origin HEAD:bugfix/phase39-cross-layer-recovery-choice
