name: Phase 39 CodeRabbit Integrity Fixes

on:
  push:
    branches: ["bugfix/phase39-cross-layer-recovery-choice"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Apply data-integrity fixes
        run: python scripts/phase39_coderabbit_integrity.py
      - name: Validate fixes
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npx cap sync ios
          git diff --exit-code -- ios
          git diff --check
      - name: Commit source and regressions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/storage.ts src/lib/__tests__/storage.test.ts src/__tests__/App.native-durable-snapshot.test.tsx
          git commit -m "Phase 39: preserve empty and archived recovery generations"
          git push origin HEAD:bugfix/phase39-cross-layer-recovery-choice
