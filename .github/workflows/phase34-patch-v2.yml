name: Phase 34 Save Retry Patcher V2

on:
  push:
    branches: ["bugfix/phase34-save-retry-hardening"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Apply save retry implementation
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/lib/storage.ts',
              'export type SaveOptions = {',
              '''export function isRetryableSaveFailure(
            result: SaveResult | null | undefined,
          ): boolean {
            return (
              result?.ok === false &&
              (result.reason === "quota" ||
                result.reason === "unavailable" ||
                result.reason === "unknown")
            );
          }

          export type SaveOptions = {''',
          )

          replace_once(
              'src/lib/i18n.ts',
              '  saveErrorEn: "Could not save",\n',
              '''  saveErrorEn: "Could not save",
            saveErrorQuota: "保存領域の上限に達したため、保存できませんでした",
            saveErrorUnavailable: "端末内の保存先を利用できませんでした",
            saveErrorInvalidData: "この内容を安全に保存できませんでした",
            retrySave: "もう一度保存する",
            retrySaveEn: "Try saving again",
          ''',
          )

          retry_block = '''  const retrySaveCurrentNotes = useCallback(() => {
            clearPersistTimer();
            // conflict/recovery は専用UIの明示選択でのみ解決する。通常Retryで force しない。
            if (saveGuardRef.current || externalConflictRef.current) return;

            const snapshot = latestNotesRef.current;
            const result = saveNotes(snapshot, {
              expectedNotes: baselineNotesRef.current,
              writerId: persistenceWriterId,
            });
            applySaveResult(result, snapshot);
          }, [applySaveResult, clearPersistTimer, persistenceWriterId]);

          '''
          replace_once(
              'src/App.tsx',
              '  const openNote = useCallback',
              retry_block + '  const openNote = useCallback',
          )
          replace_once(
              'src/App.tsx',
              'conflictMessage={canLoadStoredNotes ? copy.saveConflict : copy.saveRecovery}\n',
              'conflictMessage={canLoadStoredNotes ? copy.saveConflict : copy.saveRecovery}\n          onRetrySave={externalConflict ? undefined : retrySaveCurrentNotes}\n',
          )

          replace_once(
              'src/components/NoteEditor.tsx',
              'import type { SaveResult } from "../lib/storage";',
              'import { isRetryableSaveFailure, type SaveResult } from "../lib/storage";',
          )
          replace_once(
              'src/components/NoteEditor.tsx',
              '  conflictMessage?: string;\n',
              '  conflictMessage?: string;\n  /** quota / unavailable / unknown の一時的な保存失敗を内容変更なしで再試行する。 */\n  onRetrySave?: () => void;\n',
          )
          replace_once(
              'src/components/NoteEditor.tsx',
              '  conflictMessage = copy.saveConflict,\n',
              '  conflictMessage = copy.saveConflict,\n  onRetrySave,\n',
          )
          old_error = '''  const saveErrorMessage =
            saveResult?.ok === false && saveResult.reason === "conflict"
              ? conflictMessage
              : copy.saveError;
          '''
          new_error = '''  const retryableSaveError = isRetryableSaveFailure(saveResult);
            const saveErrorMessage = (() => {
              if (saveResult?.ok !== false) return copy.saveError;
              switch (saveResult.reason) {
                case "conflict":
                  return conflictMessage;
                case "quota":
                  return copy.saveErrorQuota;
                case "unavailable":
                  return copy.saveErrorUnavailable;
                case "invalid_data":
                  return copy.saveErrorInvalidData;
                default:
                  return copy.saveError;
              }
            })();

            function retrySave() {
              if (!retryableSaveError || !onRetrySave) return;
              if (savedTimer.current) {
                window.clearTimeout(savedTimer.current);
                savedTimer.current = null;
              }
              setSaveState("saving");
              onRetrySave();
            }
          '''
          replace_once('src/components/NoteEditor.tsx', old_error, new_error)
          replace_once(
              'src/components/NoteEditor.tsx',
              'zanshin-save-status flex items-center gap-gr-2 text-vermilion',
              'zanshin-save-status flex flex-wrap items-center gap-gr-2 text-vermilion',
          )
          replace_once(
              'src/components/NoteEditor.tsx',
              '<span className="font-mincho">{saveErrorMessage}</span>\n',
              '''<span className="font-mincho">{saveErrorMessage}</span>
                          {retryableSaveError && onRetrySave && (
                            <button
                              type="button"
                              onClick={retrySave}
                              className="min-h-[44px] rounded-full border border-vermilion/30 px-gr-3 py-gr-2 font-mincho text-[11px] tracking-mincho text-vermilion transition-soft hover:bg-vermilion/5 active:scale-[0.98]"
                            >
                              {copy.retrySave}
                            </button>
                          )}
                        ''',
          )
          PY

          cat > src/__tests__/App.save-retry.test.tsx <<'EOF'
          import { StrictMode, act } from "react";
          import { createRoot, type Root } from "react-dom/client";
          import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
          import App from "../App";
          import {
            PENDING_SAVE_KEY_FOR_TESTING,
            STORAGE_KEY_FOR_TESTING,
          } from "../lib/storage";
          import { copy } from "../lib/i18n";
          import type { Note } from "../types/note";

          (globalThis as { IS_REACT_ACT_ENVIRONMENT?: boolean }).IS_REACT_ACT_ENVIRONMENT = true;

          function makeNote(overrides: Partial<Note> = {}): Note {
            return {
              id: "note-1",
              title: "元のメモ",
              body: "本文",
              createdAt: "2026-08-28T00:00:00.000Z",
              updatedAt: "2026-08-28T00:00:00.000Z",
              isFavorite: false,
              locale: "ja",
              ...overrides,
            };
          }

          function mockLocalStorage() {
            const store: Record<string, string> = {};
            return {
              getItem: vi.fn((key: string) => store[key] ?? null),
              setItem: vi.fn((key: string, value: string) => {
                store[key] = value;
              }),
              removeItem: vi.fn((key: string) => {
                delete store[key];
              }),
              clear: vi.fn(() => {
                Object.keys(store).forEach((key) => delete store[key]);
              }),
              get _store() {
                return store;
              },
            };
          }

          function click(element: Element) {
            element.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          }

          function findButton(container: HTMLElement, text: string): HTMLButtonElement {
            const button = Array.from(container.querySelectorAll("button")).find((candidate) =>
              candidate.textContent?.includes(text),
            );
            if (!(button instanceof HTMLButtonElement)) {
              throw new Error(`Button not found: ${text}`);
            }
            return button;
          }

          function hasButton(container: HTMLElement, text: string): boolean {
            return Array.from(container.querySelectorAll("button")).some((candidate) =>
              candidate.textContent?.includes(text),
            );
          }

          function openExistingNoteEditor(container: HTMLElement) {
            act(() => click(findButton(container, "元のメモ")));
            act(() => click(findButton(container, copy.editNote)));
          }

          function changeTextarea(container: HTMLElement, value: string) {
            const textarea = container.querySelector("textarea");
            if (!(textarea instanceof HTMLTextAreaElement)) throw new Error("textarea not found");
            const valueSetter = Object.getOwnPropertyDescriptor(
              HTMLTextAreaElement.prototype,
              "value",
            )?.set;
            valueSetter?.call(textarea, value);
            textarea.dispatchEvent(new Event("input", { bubbles: true }));
          }

          describe("App save retry", () => {
            let storage: ReturnType<typeof mockLocalStorage>;
            let container: HTMLDivElement;
            let root: Root | null = null;

            beforeEach(() => {
              vi.useFakeTimers();
              storage = mockLocalStorage();
              Object.defineProperty(window, "localStorage", {
                value: storage,
                writable: true,
                configurable: true,
              });
              container = document.createElement("div");
              document.body.appendChild(container);
              storage.setItem(STORAGE_KEY_FOR_TESTING, JSON.stringify([makeNote()]));
              root = createRoot(container);
              act(() => {
                root?.render(
                  <StrictMode>
                    <App />
                  </StrictMode>,
                );
              });
              openExistingNoteEditor(container);
            });

            afterEach(() => {
              if (root) act(() => root?.unmount());
              container.remove();
              vi.useRealTimers();
            });

            function failPendingWrites(errorFactory: () => unknown) {
              storage.setItem.mockImplementation((key: string, value: string) => {
                if (key === PENDING_SAVE_KEY_FOR_TESTING) throw errorFactory();
                storage._store[key] = value;
              });
            }

            function restoreWrites() {
              storage.setItem.mockImplementation((key: string, value: string) => {
                storage._store[key] = value;
              });
            }

            const retryableFailures = [
              {
                name: "quota",
                error: () => new DOMException("quota", "QuotaExceededError"),
                message: copy.saveErrorQuota,
              },
              {
                name: "unavailable",
                error: () => new DOMException("blocked", "SecurityError"),
                message: copy.saveErrorUnavailable,
              },
              {
                name: "unknown",
                error: () => new Error("unexpected storage failure"),
                message: copy.saveError,
              },
            ] as const;

            it.each(retryableFailures)(
              "$name 保存失敗は内容を変えずに明示Retryできる",
              ({ error, message }) => {
                failPendingWrites(error);
                act(() => changeTextarea(container, "Retryで確定する本文"));
                act(() => vi.advanceTimersByTime(500));

                expect(container.textContent).toContain(message);
                expect(hasButton(container, copy.retrySave)).toBe(true);
                const beforeRetry = JSON.parse(
                  storage._store[STORAGE_KEY_FOR_TESTING],
                ) as Note[];
                expect(beforeRetry[0].body).toBe("本文");

                restoreWrites();
                act(() => click(findButton(container, copy.retrySave)));

                const saved = JSON.parse(storage._store[STORAGE_KEY_FOR_TESTING]) as Note[];
                expect(saved[0].body).toBe("Retryで確定する本文");
                expect(container.textContent).toContain(copy.saved);
                expect(hasButton(container, copy.retrySave)).toBe(false);
              },
            );

            it("Retryが再度失敗しても未保存状態とRetry導線を維持する", () => {
              failPendingWrites(() => new DOMException("quota", "QuotaExceededError"));
              act(() => changeTextarea(container, "まだ保存できない本文"));
              act(() => vi.advanceTimersByTime(500));
              act(() => click(findButton(container, copy.retrySave)));

              const primary = JSON.parse(storage._store[STORAGE_KEY_FOR_TESTING]) as Note[];
              expect(primary[0].body).toBe("本文");
              expect(container.textContent).toContain(copy.saveErrorQuota);
              expect(hasButton(container, copy.retrySave)).toBe(true);
            });

            it("Retry直前に別タブ更新があれば通常Retryで上書きせず競合UIへ昇格する", () => {
              failPendingWrites(() => new DOMException("quota", "QuotaExceededError"));
              act(() => changeTextarea(container, "ローカル未保存本文"));
              act(() => vi.advanceTimersByTime(500));
              expect(hasButton(container, copy.retrySave)).toBe(true);

              restoreWrites();
              const remote = [
                makeNote({
                  title: "別タブ最新版",
                  body: "remote本文",
                  updatedAt: "2026-08-28T00:20:00.000Z",
                }),
              ];
              const remoteRaw = JSON.stringify(remote);
              storage.setItem(STORAGE_KEY_FOR_TESTING, remoteRaw);

              act(() => click(findButton(container, copy.retrySave)));

              expect(storage._store[STORAGE_KEY_FOR_TESTING]).toBe(remoteRaw);
              expect(container.textContent).toContain(copy.storageConflictTitle);
              expect(container.textContent).toContain(copy.saveConflict);
              expect(hasButton(container, copy.retrySave)).toBe(false);
            });
          });
          EOF

          cat > src/lib/__tests__/storage.retry.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { isRetryableSaveFailure } from "../storage";

          describe("isRetryableSaveFailure", () => {
            it("一時的な保存先失敗だけをRetry対象にする", () => {
              expect(isRetryableSaveFailure({ ok: false, reason: "quota" })).toBe(true);
              expect(isRetryableSaveFailure({ ok: false, reason: "unavailable" })).toBe(true);
              expect(isRetryableSaveFailure({ ok: false, reason: "unknown" })).toBe(true);
            });

            it("競合・不正データ・成功は通常Retry対象にしない", () => {
              expect(isRetryableSaveFailure({ ok: false, reason: "conflict" })).toBe(false);
              expect(isRetryableSaveFailure({ ok: false, reason: "invalid_data" })).toBe(false);
              expect(isRetryableSaveFailure({ ok: true })).toBe(false);
              expect(isRetryableSaveFailure(null)).toBe(false);
            });
          });
          EOF

      - name: Validate implementation
        run: |
          npm ci
          npm run check
          npx cap sync ios
          git diff --exit-code -- ios

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git status --short
          git commit -m "Phase 34: add safe explicit save retry"
          git push origin HEAD:bugfix/phase34-save-retry-hardening
