name: Phase 41 Native Read Uncertainty

on:
  push:
    branches: ["bugfix/phase41-native-read-uncertainty"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Apply conservative native read fallback
        run: python scripts/phase41_native_read_uncertainty.py
      - name: Validate Phase 41
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npx cap sync ios
          git diff --exit-code -- ios
          git diff --check
      - name: Commit source and regressions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/nativeDurableSnapshot.ts src/lib/__tests__/nativeDurableSnapshot.test.ts src/lib/__tests__/nativeDurableSnapshot.secondary-recovery.test.ts
          git commit -m "Phase 41: block rollback through unreadable native generations"
          git push origin HEAD:bugfix/phase41-native-read-uncertainty
