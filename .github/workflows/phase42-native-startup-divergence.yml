name: Phase 42 Native Startup Divergence

on:
  push:
    branches: ["bugfix/phase42-native-startup-divergence"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Remove stale hook dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/App.tsx")
          text = path.read_text()
          old = '''  }, [\n    applyCleanRemoteNotes,\n    clearPersistTimer,\n    clearRecoveryCandidateSources,\n    flagExternalConflict,\n    persistDurableSnapshot,\n  ]);'''
          new = '''  }, [\n    clearPersistTimer,\n    clearRecoveryCandidateSources,\n    flagExternalConflict,\n    persistDurableSnapshot,\n  ]);'''
          if text.count(old) != 1:
              raise SystemExit(f"probe dependency marker: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate Phase 42
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npx cap sync ios
          git diff --exit-code -- ios
          git diff --check
      - name: Commit lint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Phase 42: remove stale native probe dependency"
          git push origin HEAD:bugfix/phase42-native-startup-divergence
