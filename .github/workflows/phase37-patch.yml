name: Phase 37 Native Lifecycle Patcher

on:
  push:
    branches: ["bugfix/phase37-native-lifecycle-arm64"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Capacitor App plugin
        run: npm install @capacitor/app@7.1.2 --save-exact
      - name: Apply source and native patch
        run: |
          python scripts/phase37_patch.py
          python scripts/phase37_fix_test.py
      - name: Validate implementation
        run: |
          npm audit --omit=dev --audit-level=high
          npm run check
          npx cap sync ios
          grep -q "CapacitorApp" ios/App/Podfile
          grep -q "<string>arm64</string>" ios/App/App/Info.plist
          if grep -q "<string>armv7</string>" ios/App/App/Info.plist; then
            echo "armv7 capability unexpectedly remains" >&2
            exit 1
          fi
          git diff --check
      - name: Commit Phase 37 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src ios
          git status --short
          git commit -m "Phase 37: harden native lifecycle persistence and arm64 capability"
          git push origin HEAD:bugfix/phase37-native-lifecycle-arm64
